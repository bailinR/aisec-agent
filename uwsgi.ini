[uwsgi]
# 原有配置保持不变
module = aisec_agent.api.entry:app
master = true
processes = 4
threads = 2
http = 0.0.0.0:4117
vacuum = true
die-on-term = true
py-autoreload = 1
logto = /app/content/logs/aisec_agent.log

# 设置10分钟超时
# socket操作超时时间设为600秒（10分钟）
socket-timeout = 600
# HTTP请求超时时间设为600秒（10分钟）
http-timeout = 600
# 请求处理超时时间设为600秒（10分钟）
harakiri = 600
# 启用详细的harakiri日志
harakiri-verbose = true

# 其他相关配置
# 请求完成的最大等待时间
worker-reload-mercy = 120
# 缓冲区设置
buffer-size = 65535
post-buffering = 65535
