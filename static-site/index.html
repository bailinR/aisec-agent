<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AISEC Agent</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, "Microsoft YaHei", sans-serif;
      background: #f6f7f9;
      color: #1f2937;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
    }

    main {
      width: min(720px, calc(100% - 32px));
      padding: 40px;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      box-shadow: 0 16px 40px rgba(15, 23, 42, 0.08);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 36px;
      line-height: 1.2;
    }

    p {
      margin: 0 0 12px;
      font-size: 17px;
      line-height: 1.8;
      color: #4b5563;
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 20px;
      padding: 10px 14px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-weight: 700;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
    }
  </style>
</head>
<body>
  <main>
    <h1>AISEC Agent</h1>
    <p>静态网站已经部署成功。</p>
    <p>下一步可以在这台服务器上继续部署 API 服务，并通过同一个域名或公网 IP 对外提供接口。</p>
    <div class="status"><span class="dot"></span> Server Online</div>
  </main>
</body>
</html>
